[project]
name = "probekit-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "probekit-core",
    "probekit-harvest",
    "probekit-sae",
    "probekit-circuit",
    "probekit-auto-interp",
    "probekit-probes",
    "probekit-steering",
    "probekit-registry",
    "probekit-monitor",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
]

[project.scripts]
probekit = "probekit.api.cli:main"
