[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "probekit"
version = "0.2.0"
description = "GPT-2 activation harvesting, sparse autoencoders, and probe evaluation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=0.49",
    "datasets>=3.3,<5",
    "duckdb>=1.2",
    "fastapi>=0.115",
    "huggingface-hub>=0.34,<1",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "pyarrow>=18",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "safetensors>=0.5",
    "scikit-learn>=1.6",
    "scipy>=1.11",
    "threadpoolctl>=3.1",
    "torch>=2.6,<3",
    "transformers>=4.51,<5",
    "typer>=0.15",
    "uvicorn>=0.34",
]

[project.scripts]
probekit = "probekit.cli:app"

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.3", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/probekit"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["slow: full pipeline or external model artifacts"]
