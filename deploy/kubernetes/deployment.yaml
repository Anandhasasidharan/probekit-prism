apiVersion: apps/v1
kind: Deployment
metadata:
  name: probekit-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probekit-api
  template:
    metadata:
      labels:
        app: probekit-api
    spec:
      containers:
        - name: api
          image: probekit-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: PROBEKIT_CONFIG
              value: /app/config.yaml
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: probekit-secrets
                  key: openai-api-key
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: probekit-api
spec:
  selector:
    app: probekit-api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
